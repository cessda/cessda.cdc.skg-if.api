[tox]
envlist = py311,py312,py313,py314,py315

[testenv]
deps = -r requirements.txt
commands = python -m unittest discover -b -s tests -t .

[testenv:with-coverage]
basepython = python3.12
deps = -r requirements.txt
commands = coverage run -m unittest discover -b -s tests -t .
           coverage xml
           coverage report

[testenv:ruff-check]
skip_install = true
deps = ruff
commands =
    ruff check setup.py cessda_skgif_api tests
    ruff format --check setup.py cessda_skgif_api tests

[testenv:ruff-format]
skip_install = true
deps = ruff
commands = ruff format setup.py cessda_skgif_api tests
